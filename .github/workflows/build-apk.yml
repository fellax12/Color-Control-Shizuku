name: Build Color Control APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Não usamos android-actions/setup-android aqui.
      # O runner do GitHub já possui o Android SDK.
      - name: Configure Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          sdkmanager --list_installed

      # O projeto Android inteiro é criado dentro do runner.
      # Portanto, o repositório pode conter apenas este workflow.
      - name: Create Android project
        shell: bash
        run: |
          mkdir -p app/src/main/java/br/com/impulsedigital/colorcontrol
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)

              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "ColorControlShizuku"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "br.com.impulsedigital.colorcontrol"
              compileSdk = 35

              defaultConfig {
                  applicationId = "br.com.impulsedigital.colorcontrol"

                  minSdk = 26
                  targetSdk = 35

                  versionCode = 1
                  versionName = "0.1.0"
              }

              buildFeatures {
                  viewBinding = true
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.15.0")
              implementation("androidx.appcompat:appcompat:1.7.0")
              implementation("com.google.android.material:material:1.12.0")

              implementation("dev.rikka.shizuku:api:13.1.5")
              implementation("dev.rikka.shizuku:provider:13.1.5")
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission
                  android:name="moe.shizuku.manager.permission.API_V23" />

              <application
                  android:allowBackup="true"
                  android:supportsRtl="true"
                  android:label="Color Control"
                  android:theme="@style/Theme.ColorControl">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>

              <style
                  name="Theme.ColorControl"
                  parent="Theme.Material3.DayNight.NoActionBar">

                  <item name="android:fontFamily">sans</item>

              </style>

          </resources>
          EOF

          cat > app/src/main/res/layout/activity_main.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <ScrollView
              xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:fillViewport="true">

              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:orientation="vertical"
                  android:padding="20dp">

                  <TextView
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="Color Control"
                      android:textSize="30sp"
                      android:textStyle="bold" />

                  <TextView
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="Shizuku Color Engine"
                      android:textSize="16sp"
                      android:paddingBottom="8dp" />

                  <TextView
                      android:id="@+id/status"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:text="Shizuku: verificando..."
                      android:textStyle="bold"
                      android:paddingTop="8dp"
                      android:paddingBottom="16dp" />

                  <Button
                      android:id="@+id/permission"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:text="Conectar / autorizar Shizuku" />

                  <Button
                      android:id="@+id/backup"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:text="Fazer backup das cores atuais" />

                  <Button
                      android:id="@+id/disableDynamic"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:text="Desativar Dynamic Color / Monet" />

                  <Button
                      android:id="@+id/wallpaperDynamic"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:text="Restaurar cores do papel de parede" />

                  <EditText
                      android:id="@+id/hex"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:hint="#FF6B00"
                      android:inputType="text"
                      android:maxLines="1" />

                  <Button
                      android:id="@+id/applyHex"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:text="Aplicar cor HEX" />

                  <Button
                      android:id="@+id/light"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:text="Tema claro" />

                  <Button
                      android:id="@+id/dark"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:text="Tema escuro" />

                  <Button
                      android:id="@+id/autoTheme"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:text="Tema automático" />

                  <Button
                      android:id="@+id/grayscale"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:text="Ativar escala de cinza" />

                  <Button
                      android:id="@+id/disableGrayscale"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:text="Desativar escala de cinza" />

                  <Button
                      android:id="@+id/invert"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:text="Alternar inversão de cores" />

                  <Button
                      android:id="@+id/diagnose"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:text="Diagnóstico do sistema e overlays" />

                  <Button
                      android:id="@+id/restore"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:text="Restaurar backup" />

                  <TextView
                      android:id="@+id/output"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:paddingTop="20dp"
                      android:paddingBottom="30dp"
                      android:textIsSelectable="true"
                      android:typeface="monospace" />

              </LinearLayout>

          </ScrollView>
          EOF

          cat > app/src/main/java/br/com/impulsedigital/colorcontrol/MainActivity.kt <<'EOF'
