name: Build Color Control APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Criar projeto Android
        shell: bash
        run: |
          set -e

          mkdir -p app/src/main/java/br/com/impulsedigital/colorcontrol
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "ColorControl"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "br.com.impulsedigital.colorcontrol"
              compileSdk = 35

              defaultConfig {
                  applicationId = "br.com.impulsedigital.colorcontrol"
                  minSdk = 26
                  targetSdk = 35
                  versionCode = 1
                  versionName = "0.1.0"
              }

              buildFeatures {
                  viewBinding = true
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.15.0")
              implementation("androidx.appcompat:appcompat:1.7.0")
              implementation("com.google.android.material:material:1.12.0")

              implementation("dev.rikka.shizuku:api:13.1.5")
              implementation("dev.rikka.shizuku:provider:13.1.5")
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission
                  android:name="moe.shizuku.manager.permission.API_V23" />

              <application
                  android:allowBackup="true"
                  android:supportsRtl="true"
                  android:label="Color Control"
                  android:theme="@style/Theme.ColorControl">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <resources>

              <style
                  name="Theme.ColorControl"
                  parent="Theme.Material3.DayNight.NoActionBar" />

          </resources>
          EOF

          cat > app/src/main/res/layout/activity_main.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <ScrollView
              xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:fillViewport="true">

              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:orientation="vertical"
                  android:padding="20dp">

                  <TextView
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:text="Color Control"
                      android:textSize="30sp"
                      android:textStyle="bold" />

                  <TextView
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:text="Controle avançado de cores via Shizuku"
                      android:textSize="15sp"
                      android:paddingBottom="16dp" />

                  <TextView
                      android:id="@+id/status"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:text="Shizuku: verificando..."
                      android:textStyle="bold"
                      android:paddingBottom="16dp" />

                  <Button
                      android:id="@+id/permission"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:text="Autorizar Shizuku" />

                  <Button
                      android:id="@+id/backup"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:text="Salvar configuração atual" />

                  <Button
                      android:id="@+id/disableDynamic"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:text="Desativar Dynamic Color / Monet" />

                  <Button
                      android:id="@+id/wallpaperDynamic"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:text="Restaurar cores do wallpaper" />

                  <EditText
                      android:id="@+id/hex"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:hint="#FF6B00"
                      android:inputType="text"
                      android:maxLines="1" />

                  <Button
                      android:id="@+id/applyHex"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:text="Aplicar cor HEX" />

                  <Button
                      android:id="@+id/light"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:text="Modo claro" />

                  <Button
                      android:id="@+id/dark"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:text="Modo escuro" />

                  <Button
                      android:id="@+id/autoTheme"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:text="Modo automático" />

                  <Button
                      android:id="@+id/grayscaleOn"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:text="Ativar escala de cinza" />

                  <Button
                      android:id="@+id/grayscaleOff"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:text="Desativar escala de cinza" />

                  <Button
                      android:id="@+id/invert"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:text="Alternar inversão de cores" />

                  <Button
                      android:id="@+id/diagnose"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:text="Diagnóstico de cores e overlays" />

                  <Button
                      android:id="@+id/restore"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:text="Restaurar configuração salva" />

                  <TextView
                      android:id="@+id/output"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:paddingTop="20dp"
                      android:paddingBottom="40dp"
                      android:textIsSelectable="true"
                      android:typeface="monospace" />

              </LinearLayout>

          </ScrollView>
          EOF

          cat > app/src/main/java/br/com/impulsedigital/colorcontrol/MainActivity.kt <<'EOF'
          package br.com.impulsedigital.colorcontrol

          import android.content.pm.PackageManager
          import android.os.Bundle
          import androidx.appcompat.app.AppCompatActivity
          import br.com.impulsedigital.colorcontrol.databinding.ActivityMainBinding
          import rikka.shizuku.Shizuku

          class MainActivity : AppCompatActivity() {

              private lateinit var b: ActivityMainBinding
              private val permissionCode = 100

              private val prefs by lazy {
                  getSharedPreferences("color_control", MODE_PRIVATE)
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  b = ActivityMainBinding.inflate(layoutInflater)
                  setContentView(b.root)

                  refreshStatus()

                  b.permission.setOnClickListener {
                      requestShizuku()
                  }

                  b.backup.setOnClickListener {
                      command(
                          "settings get secure theme_customization_overlay_packages"
                      ) { result ->

                          prefs.edit()
                              .putString("theme_backup", result.trim())
                              .apply()

                          b.output.text =
                              "Configuração salva:\n\n$result"
                      }
                  }

                  b.disableDynamic.setOnClickListener {
                      execute(
                          "settings put secure theme_customization_overlay_packages '{}'"
                      )
                  }

                  b.wallpaperDynamic.setOnClickListener {
                      execute(
                          "settings delete secure theme_customization_overlay_packages"
                      )
                  }

                  b.applyHex.setOnClickListener {
                      applyHex()
                  }

                  b.light.setOnClickListener {
                      execute("cmd uimode night no")
                  }

                  b.dark.setOnClickListener {
                      execute("cmd uimode night yes")
                  }

                  b.autoTheme.setOnClickListener {
                      execute("cmd uimode night auto")
                  }

                  b.grayscaleOn.setOnClickListener {
                      execute(
                          "settings put secure accessibility_display_daltonizer_enabled 1; " +
                          "settings put secure accessibility_display_daltonizer 0"
                      )
                  }

                  b.grayscaleOff.setOnClickListener {
                      execute(
                          "settings put secure accessibility_display_daltonizer_enabled 0"
                      )
                  }

                  b.invert.setOnClickListener {
                      execute(
                          """
                          CURRENT=$(settings get secure accessibility_display_inversion_enabled)

                          if [ "$CURRENT" = "1" ]; then
                              settings put secure accessibility_display_inversion_enabled 0
                              echo "Inversão desativada"
                          else
                              settings put secure accessibility_display_inversion_enabled 1
                              echo "Inversão ativada"
                          fi
                          """.trimIndent()
                      )
                  }

                  b.diagnose.setOnClickListener {
                      execute(
                          """
                          echo "===== COLOR CONTROL ====="

                          echo
                          echo "Modelo:"
                          getprop ro.product.model

                          echo
                          echo "Fabricante:"
                          getprop ro.product.manufacturer

                          echo
                          echo "Android:"
                          getprop ro.build.version.release

                          echo
                          echo "SDK:"
                          getprop ro.build.version.sdk

                          echo
                          echo "ROM:"
                          getprop ro.build.display.id

                          echo
                          echo "Configuração Monet:"
                          settings get secure theme_customization_overlay_packages

                          echo
                          echo "UI Mode:"
                          cmd uimode

                          echo
                          echo "Overlays:"
                          cmd overlay list | grep -Ei 'color|theme|monet|accent|systemui|miui' || true
                          """.trimIndent()
                      )
                  }

                  b.restore.setOnClickListener {

                      val saved =
                          prefs.getString(
                              "theme_backup",
                              null
                          )

                      if (saved == null) {

                          b.output.text =
                              "Nenhuma configuração salva."

                      } else {

                          val safe =
                              saved.replace(
                                  "'",
                                  "'\\''"
                              )

                          execute(
                              "settings put secure theme_customization_overlay_packages '$safe'"
                          )
                      }
                  }
              }

              private fun requestShizuku() {

                  if (!Shizuku.pingBinder()) {

                      b.output.text =
                          "Shizuku não está ativo. Inicie o Shizuku e tente novamente."

                      return
                  }

                  if (
                      Shizuku.checkSelfPermission() !=
                      PackageManager.PERMISSION_GRANTED
                  ) {

                      Shizuku.requestPermission(
                          permissionCode
                      )

                  } else {

                      refreshStatus()

                      b.output.text =
                          "Shizuku já está autorizado."
                  }
              }

              override fun onRequestPermissionsResult(
                  requestCode: Int,
                  permissions: Array<out String>,
                  grantResults: IntArray
              ) {

                  super.onRequestPermissionsResult(
                      requestCode,
                      permissions,
                      grantResults
                  )

                  refreshStatus()
              }

              private fun refreshStatus() {

                  val running =
                      try {
                          Shizuku.pingBinder()
                      } catch (_: Throwable) {
                          false
                      }

                  if (!running) {

                      b.status.text =
                          "Shizuku: desconectado"

                      return
                  }

                  val allowed =
                      Shizuku.checkSelfPermission() ==
                      PackageManager.PERMISSION_GRANTED

                  b.status.text =
                      if (allowed) {
                          "Shizuku: conectado e autorizado ✓"
                      } else {
                          "Shizuku: conectado — autorização necessária"
                      }
              }

              private fun applyHex() {

                  val value =
                      b.hex.text
                          .toString()
                          .trim()
                          .removePrefix("#")

                  if (
                      !Regex("[0-9a-fA-F]{6}")
                          .matches(value)
                  ) {

                      b.output.text =
                          "HEX inválido. Exemplo: #FF6B00"

                      return
                  }

                  val color =
                      "FF${value.uppercase()}"

                  val json =
                      """{"android.theme.customization.system_palette":"$color","android.theme.customization.accent_color":"$color","android.theme.customization.color_source":"preset","android.theme.customization.color_both":"1"}"""

                  execute(
                      "settings put secure theme_customization_overlay_packages '$json'"
                  )
              }

              private fun execute(cmd: String) {

                  command(cmd) { result ->

                      b.output.text =
                          result.ifBlank {
                              "Comando executado."
                          }

                      refreshStatus()
                  }
              }

              private fun command(
                  cmd: String,
                  callback: (String) -> Unit
              ) {

                  if (!Shizuku.pingBinder()) {

                      callback(
                          "Shizuku não está ativo."
                      )

                      return
                  }

                  if (
                      Shizuku.checkSelfPermission() !=
                      PackageManager.PERMISSION_GRANTED
                  ) {

                      callback(
                          "Autorize o Color Control no Shizuku."
                      )

                      return
                  }

                  Thread {

                      try {

                          val process =
                              Shizuku.newProcess(
                                  arrayOf(
                                      "sh",
  
