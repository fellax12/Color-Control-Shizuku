name: Build Color Control APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Create Android project
        shell: bash
        run: |
          mkdir -p app/src/main/java/br/com/impulsedigital/colorcontrol
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "ColorControl"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "br.com.impulsedigital.colorcontrol"
              compileSdk = 35

              defaultConfig {
                  applicationId = "br.com.impulsedigital.colorcontrol"
                  minSdk = 26
                  targetSdk = 35
                  versionCode = 1
                  versionName = "0.1.0"
              }

              buildFeatures {
                  viewBinding = true
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.15.0")
              implementation("androidx.appcompat:appcompat:1.7.0")
              implementation("com.google.android.material:material:1.12.0")

              implementation("dev.rikka.shizuku:api:13.1.5")
              implementation("dev.rikka.shizuku:provider:13.1.5")
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="moe.shizuku.manager.permission.API_V23" />

              <application
                  android:allowBackup="true"
                  android:label="Color Control"
                  android:theme="@style/Theme.ColorControl">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>

              <style
                  name="Theme.ColorControl"
                  parent="Theme.Material3.DayNight.NoActionBar">

                  <item name="android:fontFamily">sans</item>

              </style>

          </resources>
          EOF

          cat > app/src/main/res/layout/activity_main.xml <<'EOF'
          <ScrollView
              xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent">

              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:orientation="vertical"
                  android:padding="20dp">

                  <TextView
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="Color Control"
                      android:textSize="30sp"
                      android:textStyle="bold" />

                  <TextView
                      android:id="@+id/status"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:paddingTop="8dp"
                      android:paddingBottom="16dp"
                      android:text="Shizuku: verificando..." />

                  <Button
                      android:id="@+id/permission"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:text="Autorizar Shizuku" />

                  <Button
                      android:id="@+id/disableDynamic"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:text="Desativar Dynamic Color" />

                  <Button
                      android:id="@+id/wallpaperDynamic"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:text="Cores do papel de parede" />

                  <EditText
                      android:id="@+id/hex"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:hint="#FF6B00"
                      android:inputType="text" />

                  <Button
                      android:id="@+id/applyHex"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:text="Aplicar cor personalizada" />

                  <Button
                      android:id="@+id/light"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:text="Tema claro" />

                  <Button
                      android:id="@+id/dark"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:text="Tema escuro" />

                  <Button
                      android:id="@+id/autoTheme"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:text="Tema automático" />

                  <Button
                      android:id="@+id/diagnose"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:text="Diagnóstico de cores e overlays" />

                  <TextView
                      android:id="@+id/output"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:paddingTop="20dp"
                      android:textIsSelectable="true"
                      android:typeface="monospace" />

              </LinearLayout>

          </ScrollView>
          EOF

          cat > app/src/main/java/br/com/impulsedigital/colorcontrol/MainActivity.kt <<'EOF'
          package br.com.impulsedigital.colorcontrol

          import android.content.pm.PackageManager
          import android.os.Bundle
          import androidx.appcompat.app.AppCompatActivity
          import br.com.impulsedigital.colorcontrol.databinding.ActivityMainBinding
          import rikka.shizuku.Shizuku

          class MainActivity : AppCompatActivity() {

              private lateinit var binding: ActivityMainBinding

              private val permissionCode = 100

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  binding = ActivityMainBinding.inflate(layoutInflater)
                  setContentView(binding.root)

                  updateStatus()

                  binding.permission.setOnClickListener {
                      requestShizuku()
                  }

                  binding.disableDynamic.setOnClickListener {
                      execute(
                          "settings put secure theme_customization_overlay_packages '{}'"
                      )
                  }

                  binding.wallpaperDynamic.setOnClickListener {
                      execute(
                          "settings delete secure theme_customization_overlay_packages"
                      )
                  }

                  binding.light.setOnClickListener {
                      execute("cmd uimode night no")
                  }

                  binding.dark.setOnClickListener {
                      execute("cmd uimode night yes")
                  }

                  binding.autoTheme.setOnClickListener {
                      execute("cmd uimode night auto")
                  }

                  binding.applyHex.setOnClickListener {

                      val value =
                          binding.hex.text.toString()
                              .trim()
                              .removePrefix("#")

                      if (!Regex("[0-9A-Fa-f]{6}").matches(value)) {

                          binding.output.text =
                              "Cor inválida. Exemplo: #FF6B00"

                          return@setOnClickListener
                      }

                      val color =
                          "FF${value.uppercase()}"

                      val json =
                          """{"android.theme.customization.system_palette":"$color","android.theme.customization.accent_color":"$color","android.theme.customization.color_source":"preset"}"""

                      execute(
                          "settings put secure theme_customization_overlay_packages '$json'"
                      )
                  }

                  binding.diagnose.setOnClickListener {

                      execute(
                          """
                          echo "===== COLOR CONTROL ====="
                          echo
                          echo "DEVICE:"
                          getprop ro.product.model
                          echo
                          echo "ANDROID:"
                          getprop ro.build.version.release
                          echo
                          echo "SDK:"
                          getprop ro.build.version.sdk
                          echo
                          echo "===== THEME CONFIG ====="
                          settings get secure theme_customization_overlay_packages
                          echo
                          echo "===== OVERLAYS ====="
                          cmd overlay list | grep -Ei 'color|theme|monet|accent|systemui'
                          """.trimIndent()
                      )
                  }
              }

              private fun requestShizuku() {

                  if (!Shizuku.pingBinder()) {

                      binding.output.text =
                          "Shizuku não está ativo. Abra o aplicativo Shizuku e inicie o serviço."

                      return
                  }

                  if (
                      Shizuku.checkSelfPermission() !=
                      PackageManager.PERMISSION_GRANTED
                  ) {

                      Shizuku.requestPermission(permissionCode)

                  } else {

                      updateStatus()
                  }
              }

              override fun onRequestPermissionsResult(
                  requestCode: Int,
                  permissions: Array<out String>,
                  grantResults: IntArray
              ) {

                  super.onRequestPermissionsResult(
                      requestCode,
                      permissions,
                      grantResults
                  )

                  updateStatus()
              }

              private fun updateStatus() {

                  val running =
                      try {
                          Shizuku.pingBinder()
                      } catch (_: Throwable) {
                          false
                      }

                  if (!running) {

                      binding.status.text =
                          "Shizuku: não conectado"

                      return
                  }

                  val permission =
                      Shizuku.checkSelfPermission() ==
                      PackageManager.PERMISSION_GRANTED

                  binding.status.text =
                      if (permission)
                          "Shizuku: conectado ✓"
                      else
                          "Shizuku: aguardando autorização"
              }

              private fun execute(command: String) {

                  if (!Shizuku.pingBinder()) {

                      binding.output.text =
                          "Shizuku não está ativo."

                      return
                  }

                  if (
                      Shizuku.checkSelfPermission() !=
                      PackageManager.PERMISSION_GRANTED
                  ) {

                      binding.output.text =
                          "Autorize o aplicativo no Shizuku primeiro."

                      return
                  }

                  Thread {

                      try {

                          val process =
                              Shizuku.newProcess(
                                  arrayOf(
                                      "sh",
                                      "-c",
                                      command
                                  ),
                                  null,
                                  null
                              )

                          val output =
                              process.inputStream
                                  .bufferedReader()
                                  .readText()

                          val error =
                              process.errorStream
                                  .bufferedReader()
                                  .readText()

                          process.waitFor()

                          runOnUiThread {

                              binding.output.text =
                                  if (error.isBlank())
                                      output.ifBlank {
                                          "Comando executado."
                                      }
                                  else
                                      "$output\n$error"
                          }

                      } catch (error: Throwable) {

                          runOnUiThread {

                              binding.output.text =
                                  "Erro: ${error.message}"
                          }
                      }

                  }.start()
              }
          }
          EOF

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Compile APK
        run: |
          gradle :app:assembleDebug --stacktrace

      - name: Prepare APK
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk \
             release/Color-Control-Shizuku-0.1.0.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Color-Control-Shizuku-APK
          path: release/Color-Control-Shizuku-0.1.0.apk
          if-no-files-found: error
